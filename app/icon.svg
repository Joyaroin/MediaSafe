<!-- The press mark, from DESIGN.md: a 22×22 hairline square with a struck vermilion
     bar. The one place a palette value is repeated as a literal rather than read from
     `--color-signal`, because it sits inside an SVG `fill` — if the vermilion ever
     moves, this is one of the two places to change. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect width="24" height="24" fill="#0E0D0B"/>
  <rect x="1" y="1" width="22" height="22" fill="none" stroke="#E8E2D4" stroke-width="2"/>
  <rect x="5" y="10.5" width="14" height="3" fill="#E85A38"/>
</svg>
