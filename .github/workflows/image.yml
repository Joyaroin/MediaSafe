# Image — build the production container on every push to `main`, push it to GHCR, and
# deploy it to staging.
#
# Stages 1 and 6 of docs/adr/0001-deploy-to-k3s-on-linode-with-gitops.md. Deploying is a
# commit: the second job writes the new SHA into the gitops repo's values-staging.yaml, and
# Argo CD rolls it out. Prod takes an image only through promote.yml.
#
# **One tag per image, the commit SHA, and nothing movable.** GitOps pins an exact image in
# git; a `latest` or `main` tag would be a second answer to "what is running" that git does
# not record.
#
# **Old versions are deleted.** Private packages on GitHub's free plan have a small storage
# allowance, and one ~100 MB image per merge would fill it within a few merges. Ten
# versions is far more than a rollback will ever reach for.

name: Image

on:
  push:
    # TEMPORARY: infra-migration builds too, so staging has an image before the migration's
    # one big PR merges. Remove it from this list in that PR, before merging.
    branches: [main, infra-migration]
  # A rebuild without a commit, e.g. after changing a Sentry variable. It deploys too, which
  # is a no-op when staging already runs this SHA.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A superseded build is not worth finishing: staging only ever takes the newest image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR needs the owner in lower case; `github.repository` would give `Joyaroin`.
  IMAGE: ghcr.io/joyaroin/mediasafe

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every Sentry input may be empty: the build then passes, with no browser DSN and no
      # source-map upload. `SENTRY_RELEASE` is set because the build cannot find one itself —
      # `.git` is excluded from the build context.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository, so it inherits the repository's access.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          # One manifest per tag. Attestations would add untagged manifests that the prune
          # below would count as versions, and deleting one breaks the image it belongs to.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep the newest ten images
        uses: actions/delete-package-versions@v5
        with:
          package-name: mediasafe
          package-type: container
          min-versions-to-keep: 10

  # Staging runs whatever was built last. A fine-grained token (GITOPS_TOKEN: Contents read and
  # write on mediasafe-gitops, nothing else) is the only credential this repo holds for the
  # cluster, and all it can do is change files Argo CD reads.
  deploy-staging:
    name: deploy to staging
    needs: build
    runs-on: ubuntu-latest
    # A running deploy is never cancelled mid-push; GitHub keeps one waiting run at most, the
    # newest, so an older SHA can't land after a newer one.
    concurrency:
      group: gitops-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          repository: Joyaroin/mediasafe-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Point staging at this image
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.image.tag = strenv(TAG)' charts/mediasafe/values-staging.yaml
          if git diff --quiet; then
            echo "Staging already runs $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy MediaSafe ${TAG:0:7} to staging" \
            -m "From ${{ github.server_url }}/${{ github.repository }}/commit/$TAG"
          git push
